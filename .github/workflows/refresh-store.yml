# Checks the plugin repositories every hour and adds a new release to plugins.json (old versions always stay; a
# version that vanishes from GitHub stops the run instead). Download counts behind the Store tab's sorting are
# committed only on the Monday run and on demand from the Actions tab, so the hourly run commits only for a new
# release. GitHub Pages then republishes plugins.json and worker.js serves it.
name: Refresh store

on:
  schedule:
    - cron: '0 6 * * 1'
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-store
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Check the store script
        run: python -W error -m unittest test_build_store.py
      - name: Rebuild plugins.json
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build_store.py
      - name: Check the worker against the new catalog
        run: node --test worker.test.mjs
      - name: Commit when it changed
        env:
          ADDED: ${{ steps.build.outputs.added }}
          FULL: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1' }}
        run: |
          if git diff --quiet -- plugins.json; then
            echo "plugins.json unchanged"
            exit 0
          fi
          if [ -z "$ADDED" ] && [ "$FULL" != "true" ]; then
            echo "Only download counts changed; they are committed on the weekly run"
            exit 0
          fi
          message="store: weekly refresh of releases and download counts"
          [ -n "$ADDED" ] && message="store: add $ADDED"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git commit -m "$message"
          git push
