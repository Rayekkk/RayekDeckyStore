# Rebuilds plugins.json every Monday (and on demand from the Actions tab), so new plugin releases reach the store
# and the download counts behind the Store tab's sorting stay fresh. Commits only when plugins.json changed;
# GitHub Pages then republishes it and worker.js serves it.
name: Refresh store

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-store
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Rebuild plugins.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python build_store.py
      - name: Check the worker against the new catalog
        run: node --test worker.test.mjs
      - name: Commit when it changed
        run: |
          if git diff --quiet -- plugins.json; then
            echo "plugins.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git commit -m "store: weekly refresh of releases and download counts"
          git push
